readme = "README.md"
authors = [
    { name = "Subramanian", email = "suryasubramanian252@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu==1.15.0",
    "langchain-community==0.4.2",
    "langchain-core==1.6.0",
    "langchain-openai==1.6.0",
    "langchain-tavily==0.2.18",
    "langchain-text-splitters==1.1.2",
    "langgraph==1.2.11",
