[project]
name = "travel-multiagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Subramanian", email = "suryasubramanian252@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "airportsdata>=20260905",
    "faiss-cpu==1.15.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "langchain-community==0.4.2",
    "langchain-core==1.6.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai==1.6.0",
    "langchain-tavily==0.2.18",
    "langchain-text-splitters==1.1.2",
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-checkpoint-sqlite==3.1.1",
    "mcp>=1.30.0",
    "nest-asyncio>=1.6.0",
    "psycopg[binary,pool]>=3.3.5",
    "pycountry>=26.2.16",
    "pypdf==6.16.2",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "streamlit==1.63.0",
    "tiktoken==0.14.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
travel-multiagent = "travel_multiagent:main"

[build-system]
